name: Zig

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Format check
        run: zig fmt --check src examples interop build.zig

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all

      - name: Test ReleaseSafe
        if: matrix.os == 'ubuntu-latest'
        run: zig build test -Doptimize=ReleaseSafe --summary all

      # Autodoc parses every declaration, so a malformed doc comment or a
      # reference to something that no longer exists fails here rather than
      # on the day someone tries to read the docs.
      - name: Docs
        if: matrix.os == 'ubuntu-latest'
        run: zig build docs

  # Everything above is checked against a peer written from the same reading
  # of the spec as the code under test, so the two can agree and both be
  # wrong. These are implementations nobody here wrote.
  interop:
    name: interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build
        run: zig build

      # Pinned because this job is a required check: an unpinned install
      # means an upstream release can block every merge in the repository
      # on a morning nobody changed anything. Bump it deliberately.
      # Retried because this job gates merges: a blip at PyPI or Docker Hub
      # should cost a minute, not a red X on a pull request that is fine.
      # Only the fetches are retried -- a failing test is never retried.
      - name: Install Apache Qpid Proton
        run: |
          for attempt in 1 2 3; do
            pip install --disable-pip-version-check python-qpid-proton==0.40.0 && exit 0
            echo "::warning::pip install failed (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          echo "could not install python-qpid-proton" >&2
          exit 1

      - name: Pull Apache ActiveMQ Artemis
        run: |
          for attempt in 1 2 3; do
            docker pull apache/artemis:2.55.0-alpine && exit 0
            echo "::warning::docker pull failed (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          echo "could not pull the Artemis image" >&2
          exit 1

      - name: Start the Proton broker
        run: |
          python3 interop/broker.py 127.0.0.1:5672 > proton-broker.log 2>&1 &
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/5672) 2>/dev/null && exit 0
            sleep 1
          done
          echo "the broker never came up" >&2
          cat proton-broker.log >&2
          exit 1

      - name: Round trip through Apache Qpid Proton
        env:
          AMQP_PORT: "5672"
        run: zig build interop

      # The examples are documentation, and documentation that compiles is
      # not the same as documentation that works. These are the two that
      # rotted: both claimed to open a connection and neither did.
      - name: Run the examples against Apache Qpid Proton
        env:
          AMQP_PORT: "5672"
          AMQP_ADDRESS: example-queue
          AMQP_TIMEOUT_MS: "20000"
        run: |
          ./zig-out/bin/sender
          ./zig-out/bin/receiver

      - name: Start Apache ActiveMQ Artemis
        run: |
          docker run -d --pull never --name artemis -p 5673:5672 \
            -e ARTEMIS_USER=artemis -e ARTEMIS_PASSWORD=artemis \
            apache/artemis:2.55.0-alpine
          # Docker publishes the host port before anything inside is
          # listening, so a TCP connect proves nothing -- it succeeds and
          # then the proxy resets us. Wait for the broker to say so itself.
          for _ in $(seq 1 90); do
            if docker logs artemis 2>&1 | grep -q AMQ221007; then exit 0; fi
            sleep 2
          done
          echo "Artemis never became active" >&2
          docker logs artemis >&2
          exit 1

      # Artemis wants SASL PLAIN, so this covers the mechanism Azure services
      # use as well as a second implementation.
      - name: Round trip through Apache ActiveMQ Artemis
        env:
          AMQP_PORT: "5673"
          AMQP_USER: artemis
          AMQP_PASSWORD: artemis
        run: zig build interop

      - name: Broker logs
        if: failure()
        run: |
          echo "── Proton ──"
          cat proton-broker.log || true
          echo "── Artemis ──"
          docker logs artemis || true
