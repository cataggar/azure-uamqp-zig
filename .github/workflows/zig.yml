name: Zig

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Format check
        run: zig fmt --check src examples interop build.zig

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all

      - name: Test ReleaseSafe
        if: matrix.os == 'ubuntu-latest'
        run: zig build test -Doptimize=ReleaseSafe --summary all

  # Everything above is checked against a peer written from the same reading
  # of the spec as the code under test, so the two can agree and both be
  # wrong. These are implementations nobody here wrote.
  interop:
    name: interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build
        run: zig build

      - name: Install Apache Qpid Proton
        run: pip install --disable-pip-version-check python-qpid-proton

      - name: Start the Proton broker
        run: |
          python3 interop/broker.py 127.0.0.1:5672 > proton-broker.log 2>&1 &
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/5672) 2>/dev/null && exit 0
            sleep 1
          done
          echo "the broker never came up" >&2
          cat proton-broker.log >&2
          exit 1

      - name: Round trip through Apache Qpid Proton
        env:
          AMQP_PORT: "5672"
        run: zig build interop

      - name: Start Apache ActiveMQ Artemis
        run: |
          docker run -d --name artemis -p 5673:5672 \
            -e AMQ_USER=artemis -e AMQ_PASSWORD=artemis \
            apache/activemq-artemis:latest-alpine
          for _ in $(seq 1 90); do
            (exec 3<>/dev/tcp/127.0.0.1/5673) 2>/dev/null && exit 0
            sleep 2
          done
          echo "Artemis never came up" >&2
          docker logs artemis >&2
          exit 1

      # Artemis wants SASL PLAIN, so this covers the mechanism Azure services
      # use as well as a second implementation.
      - name: Round trip through Apache ActiveMQ Artemis
        env:
          AMQP_PORT: "5673"
          AMQP_USER: artemis
          AMQP_PASSWORD: artemis
        run: zig build interop

      - name: Broker logs
        if: failure()
        run: |
          echo "── Proton ──"
          cat proton-broker.log || true
          echo "── Artemis ──"
          docker logs artemis || true
